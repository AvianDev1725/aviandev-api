info:
  name: posts
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/posts"
  body:
    type: json
    data: |-
      {
        "title": "Hello categories",
        "slug": "hello-categories",
        "published": true,
        "categoryIds": [1,2]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
